services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio123
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9010:9000", "9011:9001"]
    volumes: ["minio_data:/data"]
  pipeline:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      DATABASE: postgresql://pipeline:pipeline@postgres:5432/pipeline
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: transactions
  dashboard:
    build: ./dashboard
    depends_on: [pipeline]
    environment:
      DATABASE: postgresql://pipeline:pipeline@postgres:5432/pipeline
    ports: ["8501:8501"]

volumes:
  minio_data:
